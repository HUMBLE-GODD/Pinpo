<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinpo - Deposition Topic Index & Source Provenance Viewer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="brand-title">
            <span>Pinpo</span>
            <span class="badge-tag">Legal Tech</span>
            <span style="font-size: 13px; font-weight: normal; color: #94a3b8; margin-left: 8px;">Deposition Topic Navigator</span>
        </div>
        <div class="meta-details">
            <div><strong>Witness:</strong> <span id="headerWitness">Persis Yu</span></div>
            <div><strong>Matter:</strong> <span id="headerMatter">Turrey v. Vervent, Inc.</span></div>
            <div><strong>Date:</strong> <span id="headerDate">March 28, 2023</span></div>
            <button id="loadBtn" style="margin-left: 12px; background: #334155; color: #f8fafc; border: 1px solid #475569; padding: 4px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 4px;">
                <span>📂</span> Load JSON
            </button>
            <input type="file" id="loadDataInput" accept=".json,.js" style="display: none;" />
        </div>
    </header>

    <div class="app-container">
        <!-- Left Pane: Topic Index Navigation -->
        <aside class="topic-pane">
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Search topics, summaries, or quotes..." />
            </div>
            <div style="padding: 8px 12px; font-size: 12px; color: #64748b; display: flex; justify-content: space-between; background: #f8fafc; border-bottom: 1px solid #e2e8f0;">
                <span id="activeTopicCount">Loading topics...</span>
                <span>Click to jump & highlight</span>
            </div>
            <div class="topic-list" id="topicList">
                <!-- Topics rendered by app.js -->
            </div>
        </aside>

        <!-- Right Pane: Transcript Verification Area -->
        <main class="transcript-pane">
            <div class="viewer-header">
                <span>Official Deposition Transcript (Verbatim 25-Line Format)</span>
                <span>Pages 7 - 88 | 2,050 Canonical Lines</span>
            </div>
            <div class="transcript-scroll-area" id="transcriptArea">
                <!-- Pages and lines rendered by app.js -->
            </div>
        </main>
    </div>

    <!-- Embedded Data & Client Controller -->
    <script src="viewer_data.js"></script>
    <script src="app.js"></script>
</body>
</html>
